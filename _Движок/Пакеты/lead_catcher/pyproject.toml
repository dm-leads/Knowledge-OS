# Ловец лидов — пакет канона Knowledge-OS (ADR-0003). Исходник здесь; проекты держат экземпляр
# (lead_catcher_instance/profile.yaml) и запускают пакет ссылкой: uv run --project <этот каталог> python -m lead_catcher.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lead_catcher"
version = "1.6.0"
description = "Ловец лидов в Telegram: чтение открытых групп и ответ автору вопроса по одобренной очереди (выключен по умолчанию), аккаунты по номерам, стоп-правила — нейтральная база без данных проектов"
requires-python = ">=3.10"
dependencies = [
    "telethon==1.45.0",
    "python-socks[asyncio]==2.7.1",
    "pyyaml>=6",
    "qrcode==8.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["lead_catcher*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.md"]
