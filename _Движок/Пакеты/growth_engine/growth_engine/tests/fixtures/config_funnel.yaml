# Конфигурация для тестов узкого места: та же нейтральная основа, что в config_minimal.yaml, плюс раздел economy.
#
# Зачем отдельный файл: воронка шага 3 обязана отбирать числа системы-источника, иначе числа модели (цель окна,
# потолки веток, эффект гипотезы) живут под той же метрикой и окном и схлопывают ступень саму на себя — это нашёл
# приёмочный прогон 7б. Но добавить economy в общую фикстуру нельзя: её читают 33 файла тестов, и команда маршрута
# начинает выводить класс главной метрики и «продажи ли цель» из ролей, отчего её собственные ключи перестают быть
# обязательными. Общая фикстура остаётся минимальной, а денежная система объявляется здесь.
goal:
  metric: sales_entry
  window_months: 3
  baseline: 850
  target_periods: ["2026-10", "2026-11"]
business_form:
  purchase: разовая
  ticket: высокий
  market: смешанный
  pmf: сильный
  manual_share: высокая
  deal_cycle: длинный
levels: [visit, lead, qualified, sales_entry, buyer, money]
flows: [web, no_visit, all]
metrics:
  visits: {level: visit, period_additive: true}
  leads: {level: lead, period_additive: true}
  qualified: {level: qualified, period_additive: true}
  sales_entry:
    level: sales_entry
    period_additive: true
    cross_scope_additive: true
    proof: "сверка двух кабинетов с CRM: 264 + 28 = 292, 10.09.2026"
  sales: {level: buyer}
  avg_check: {level: money, summable: false}
  pnl_revenue: {level: money, period_additive: true, cross_scope_additive: true, proof: "сумма кабинетов сверена с P&L — тест"}
  pnl_cogs: {level: money, period_additive: true, cross_scope_additive: true, proof: "тождество выручка − себестоимость = прибыль — тест"}
  gross_profit: {level: money, period_additive: true, cross_scope_additive: true, proof: "тождество выручка − себестоимость = прибыль — тест"}

# Система-источник чисел воронки: та же, из которой приходят числа фикстур (`C:analytics-x:data`).
economy:
  money_system: analytics-x
  money_metrics: {users: sales_entry, sales: sales, revenue: pnl_revenue, cogs: pnl_cogs, profit: gross_profit}

storage: {adapter: markdown}
