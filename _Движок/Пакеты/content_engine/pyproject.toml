# Контент-машина — пакет канона Knowledge-OS (ADR-0003). Исходник здесь; проекты подключают его ссылкой
# (pip install -e) или получают выпуск с паспортом (_Движок/Инструменты/kos_release.py).
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "content_engine"
version = "1.5.1"
description = "Контент-машина: анти-дубли до модели, очередь тем, гейты; разбор топа, бриф, сборка, публикация, «доехало», индексация; ставка из гипотезы, судья, текст и вычитка, картинки, спрос; пульс, книга ставок с деньгами, аудит недели, расписание"
requires-python = ">=3.12"
dependencies = ["pyyaml", "requests", "snowballstemmer", "google-auth"]

[project.optional-dependencies]
browser = ["playwright"]          # проверка вёрстки (Т22.4); без неё пункт «не подключено»
images = ["pillow"]               # сжатие картинок (Т30.2); без него замечание «не сжато»

[project.scripts]
content-engine = "content_engine.cli:main"

[tool.setuptools.packages.find]
include = ["content_engine*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.txt", "*.json", "*.md", "*.csv", "*.html"]
