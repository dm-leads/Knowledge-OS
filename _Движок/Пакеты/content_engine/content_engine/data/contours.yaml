# Приёмка на контур (Т42.5): у каждого контура карты — признак работы (словами карты), его проверка кодом по реестрам
# инстанса (имя функции в core/contours.py), виды известных ответов контура и тесты пакета, которые его держат.
# Данных проектов здесь нет.
contours:
  А:
    name: Спрос
    sign: карта спроса свежая и в ней есть новые кластеры без страницы; вымерший спрос замораживает человек; видно, что публикуют конкуренты
    check: demand_fresh
    known: [pair, freeze]
    tests: [test_owner_live_overlap_statuses, test_answered_questions_go_to_report_others_become_demand, test_steady_drop_is_candidate_not_frozen, test_new_urls_between_two_snapshots_proxy, test_field_spends_no_quota]
  Б:
    name: Решение
    sign: ни одна тема не доходит до текста без брони; запас тем не ниже нормы
    check: stock_norm
    known: [gate, refuse]
    tests: [test_take_without_gate_refused_with_gate_taken, test_build_prefilters_and_refill_fills_stock]
  В:
    name: Производство
    sign: в блог не попадает статья без утверждённого брифа и с блокирующими находками гейта статьи
    check: packages_verified
    known: [refuse, judge, facts]
    tests: [test_build_without_approval_refused, test_write_task_refused_without_approved_brief]
  Г:
    name: Выпуск
    sign: у каждой выпущенной статьи — день выкладки и записи дня выкладки в книге ставок
    check: releases_recorded
    known: [publish]
    tests: [test_all_records_after_verify, test_never_answers_is_unverified_not_failed]
  Д:
    name: Доказательство
    sign: пульс свежий; по каждой ставке с наступившим окном есть замер; итоги меняют приоритет направлений; почти выигранные и старые страницы дожимаются той же очередью
    check: proof_running
    known: [pulse, bet, audit, refresh, ai_score]
    tests: [test_verdict_rules_first_match, test_measure_from_publication_day_not_build, test_kill_closes_direction_and_scale_raises_weight, test_zone_candidate_by_impressions, test_empty_refresh_refused_by_gate, test_score_answer_first_and_without, test_drop_on_hundred_people_found_on_sixty_not]
  Основание:
    name: Основание
    sign: профиль текущей версии; запуски по расписанию идут; запись вовне — только с правом и --apply
    check: foundation
    known: [refuse]
    tests: [test_install_without_right_or_apply_is_plan_only, test_paid_serp_needs_yes, test_rollback_without_right_writes_nothing]
