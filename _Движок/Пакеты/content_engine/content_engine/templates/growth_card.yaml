# Карточка гипотезы для ставки темы (Т26): кладётся в папку sources.growth.path под именем <id>.yaml.
# Выгружает агент из сервера аналитики проекта (карточка гипотезы Движка роста) или заполняет с владельцем у проекта
# без своей аналитики. Машина её только читает; статусы гипотез меняет Движок роста.
id: H-1                               # номер гипотезы
formulation: >-                       # «если — то — потому что», как в реестре
  Если выпустить 5 статей направления «пример», то за 180 дней они дадут около 20 заявок, потому что …
status: идея                          # статус в реестре; «архив» — ставку не берут
exported_at: "2026-01-01"             # когда выгружена или заполнена
exported_by: агент чата контента      # кто выгрузил: агент из MCP, владелец, агент с владельцем
unit: direction                       # direction — ставка на направление из нескольких статей; article — на одну
planned_count: 5                      # статей в ставке (для article — 1)
expectation: около 20 заявок за 180 дней от выкладки каждой статьи   # ожидание словами
fail_threshold: ноль заявок у всего направления                       # порог провала словами
windows: [90, 180]                    # окна замера, дней от выкладки
decision: ""                          # решение Движка по итогам замеров: scale, iterate, kill, research; пусто — нет
decided_at: ""                        # дата решения
expectation_numbers:                  # числа ожидания строкой стандарта: у каждого — источник и статус
  - value: 20
    unit: заявки
    cabinet: ""                       # кабинет или контур системы денег
    period: 180 дней от выкладки
    denominator: ""
    source: формулировка гипотезы H-1
    as_of: "2026-01-01"
    status: оценка                    # факт, оценка, proxy, нет данных
