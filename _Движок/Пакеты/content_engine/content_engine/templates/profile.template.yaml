# Профиль проекта Контент-машины. Один файл на проект, лежит в каталоге инстанса (рядом — data/, cache/, reports/).
# Каждое поле обязательно: значений по умолчанию «молча» нет. Неизвестное поле — ошибка с его именем.
# Секреты — только именами переменных (поля *_env) и путями к ключам; значения секретов сюда не пишутся.
schema_version: 5                     # версия профиля; старую переводит `content-engine profile migrate`

site:
  domains: [example.ru]               # домены проекта; первый — основной. Кириллический домен пишется как есть
  article_sections: [blog]            # разделы адреса со статьями: https://example.ru/blog/<slug>
  sales_sections: [catalog]           # разделы адреса с продающими страницами
  sales_urls: []                      # продающие страницы списком, если раздела нет
  sitemap_url: ""                     # карта сайта для сверки корпуса (один GET); пусто — не используется
  sitemap_file: ""                    # или файл карты сайта / список адресов построчно (путь от каталога инстанса)

search:
  serp_bases: [msk]                   # базы выдачи Keys.so: msk, spb — Яндекс; gru — Google. Каждая база — объект квоты на фразу
  commercial_domains: [market.example, shop.example]  # маркетплейсы и магазины: их число в топ-10 делает выдачу коммерческой
  competitors: []                     # домены конкурентов: их запросы без нашей страницы — кандидаты (Keys.so report/compare)

corpus:
  toc_marker: "Содержание"            # строка, после которой в тексте идёт оглавление; по нему восстанавливаются разделы
  folders:                            # папки текстов по порядку; при одинаковом slug побеждает последняя
    - path: texts                     # путь от каталога инстанса или абсолютный
      pattern: "*.md"                 # шаблон файлов: "*.md" или "*/article.md"
      exclude: [README.md]            # имена файлов и папок, которые не читать
      fields: {id: id, slug: slug, title: title, url: url}  # источник → роль; роли: id, slug, title, url, date.
                                      # Источник: поле шапки; "@meta.json:slug" — ключ JSON-файла рядом с текстом;
                                      # "@row_*.json" — число из имени файла рядом. У роли может быть несколько
                                      # источников: берётся первый непустой. Нет title — берётся H1 текста
      url_template: ""                # адрес для папки без поля url: "https://{domain}/{section}/{slug}"
      section: blog                   # раздел для шаблона адреса
      index_csv: ""                   # необязательный указатель CSV (разделитель «;») с колонками ролей; пусто — нет

secrets:
  env_file: ""                        # путь к файлу .env с секретами; пусто — переменная KOS_ENV, затем окружение

sources:
  window_days: 30                     # окно сбора спроса, дней
  junk_patterns: ["скачать", "торрент", "реферат"]  # мусорные запросы: регулярные выражения
  gsc:                                # Google Search Console, сервисный аккаунт (только чтение)
    enabled: false
    site_url: ""                      # как в консоли: "sc-domain:example.ru" или "https://example.ru/"
    key_file: ""                      # путь к JSON-ключу сервисного аккаунта
  webmaster:                          # Яндекс.Вебмастер, популярные запросы (OAuth)
    enabled: false
    user_id: ""
    host_id: ""
    token_env: YANDEX_WEBMASTER_TOKEN # имя переменной с токеном
  keysso:                             # Keys.so: запросы своего домена и конкурентов, выдача
    enabled: false
    key_env: KEYSO_API_KEY
    base: msk                         # база для запросов домена и конкурентов
    site_keywords_limit: 20000        # строк отчёта по своему домену, не больше
    competitor_keywords_limit: 5000   # строк на конкурента, не больше
  demand_file:                        # своё ядро CSV: query;impressions;frequency;source
    enabled: false
    path: ""
  value:                              # ценность страницы — лесенка: file (деньги/заявки по странице), keysso (proxy), none
    kind: none
    file: ""                          # CSV: slug;money;leads;period_from;period_to;source;as_of
    average_check: null               # средний чек: деньги = заявки × чек, если денег в файле нет
  growth:                             # ставка темы из гипотезы Движка роста (Т26), только чтение
    kind: none                        # none; markdown — папка хранилища Движка роста; file — папка карточек <H>.yaml
    path: ""                          # путь от каталога инстанса; карточку file выгружает агент или заполняет с
                                      # владельцем по шаблону пакета growth_card (новый проект без своей аналитики)
  client_questions:                   # вопросы клиентов (Т31.1): CSV question;count, без персональных данных
    enabled: false
    path: ""
  wordstat:                           # частота и динамика спроса (Т31.2)
    order: []                         # источники по порядку: keysso (частота без записи), cloud (облако Яндекса:
                                      # частота, ассоциации, помесячная динамика); следующий — если предыдущий отказал
    region: "225"                     # регион облака: 225 — Россия, 213 — Москва, 2 — Петербург
    cloud_key_env: YANDEX_SEARCH_API_KEY  # имя переменной ключа облака
    cloud_folder_env: YANDEX_FOLDER_ID    # имя переменной каталога облака
    cloud_price_rub: 0                # цена запроса облака, ₽ (тарифы Yandex Cloud); выше нуля — бюджет-гейт
  suggest:                            # подсказки и похожие запросы (Т31.3): без частоты в очередь не идут
    enabled: false
    limit: 50                         # подсказок на фразу, не больше
  serp_order: [keysso]                # источники выдачи по порядку: keysso, yandex_search (запасной, платный)
  yandex_search:                      # Yandex Search API — выдача (запасной источник)
    key_env: YANDEX_SEARCH_API_KEY
    folder_env: YANDEX_FOLDER_ID
    price_rub: 0                      # цена запроса, ₽; выше нуля — бюджет-гейт
    regions: {msk: "213", spb: "2"}   # база выдачи → регион Яндекса

thresholds:                           # пороги анти-дублей — стартовые значения, калибруются на своём корпусе
  key_overlap: 0.70                   # слой 1: доля основ кандидата в ключе записи
  body_block: 60                      # слой 2, статья целиком: вес ≥ — пересекается
  body_warn: 25                       # слой 2, статья целиком: вес ≥ — спорно
  section_block: null                 # слой 2, раздел: калибруется на корпусе (пусто — измеритель только в отчёте)
  section_warn: null                  # калибруется вместе с section_block
  body_length_ref: 1000               # слой 2: статья длиннее (в основах) — вес × опорная / длина; null — без нормирования
  section_length_ref: 400             # то же для раздела: длинный обзор одним разделом не закрывает тему словами характеристик
  serp_common_urls: 3                 # слой 3 и кластеры: общих адресов в топ-10
  sales_overlap: 0.75                 # слой 5: сходство с ключами продающей страницы
  head_term_cap: 6                    # слой 6: живых статей с тем же головным термином
  title_overlap: 0.85                 # слой 7 и гейт статьи: почти-дубль заголовка
  twin_shingles: 0.015                # гейт статьи: доля общих восьмисловных цепочек
  commercial_min: 3                   # тип выдачи: магазинов в топ-10 для «коммерческая»
  serp_cache_days: 45                 # срок кэша выдачи
  gate_valid_days: 7                  # сколько дней отчёт гейта годен для взятия темы
  reservation_days: 30                # срок брони кластера
  money_days: 180                     # окно денег страницы для слоя 4
  min_impressions: 3                  # порог показов запроса за окно сбора

queue:
  per_day: 0.57                       # ритм выпуска, статей в день (4 в неделю ≈ 0.57)
  norm: 8                             # норма запаса, тем с полным гейтом
  refill_at: 6                        # пополнять при запасе ≤
  expected_rejection: 0.40            # ожидаемая доля отсева, пока нет истории журнала
  require_bet: false                  # true — пустые поля ставки (гипотеза, ожидание, порог провала) дают «спорно»;
                                      # пока ставки никто не заполняет, при true запас очереди остаётся нулём
  max_formulations: 5                 # формулировок на тему
  lead_words: []                      # слова лид-сигналов: поднимают приоритет
  commercial_words: [купить, цена, стоимость]  # слова коммерческого интента: поднимают приоритет
  pace:                               # совет по темпу (Т32.1)
    domain_since: ""                  # дата появления домена ГГГГ-ММ-ДД; пусто — первый день в Search Console
    new_domain_days: 180              # домен моложе — «новый»
    new_domain_max_per_day: 1         # статей в день для нового домена, не больше

budget:
  reserve: 0                          # объектов квоты Keys.so, которые машина не трогает
  max_quota: null                     # предел объектов на один прогон; null — весь остаток дня
  run_limit_rub: 0                    # потолок платного прогона, ₽; 0 — платные вызовы запрещены. Потолок, а не
                                      # согласие: платный вызов всё равно ждёт --confirm-spend <сумма> от человека
  month_limit_rub: 0                  # потолок за календарный месяц по data/spend.jsonl; траты вне машины
                                      # (картинки старым маршрутом) он не видит — их вносят строкой `spend add`
  usd_rub: 0                          # курс для провайдеров с ценой в долларах или кредитах; 0 — такой провайдер
                                      # отказывает до бюджет-гейта
  usd_rub_source: ""                  # откуда курс и на какую дату (ЦБ РФ, ДД.ММ.ГГГГ)

directions:                           # направления: запрос относится к первому, чьё слово в нём есть
  - name: пример направления
    words: [пример]
    weight: 1                         # вес в приоритете очереди
    quarter_quota: 0                  # тем на квартал; 0 — без квоты
    volume: [6000, 12000]             # коридор объёма статьи направления, знаков без разметки
    hypothesis_id: ""                 # гипотеза направления в Движке роста: решение kill закрывает направление, scale поднимает вес; пусто — нет

gate_article:
  levels:                             # уровень каждой проверки: block — черновик, warn — замечание, off — выключена
    title_length: block
    description_length: block
    slug: block
    title_duplicate: block
    structure: block
    skeleton: warn
    foreign_keys: block               # title, H1, H2 почти совпадают с целевым ключом чужой страницы
    foreign_mentions: warn            # целевой ключ чужой страницы (от трёх слов) в тексте без ссылки на неё
    twin: warn
    faq: block
    sales_links: warn
    sources: warn
    links_alive: block
    list_share: warn
    hygiene: block
    stop_phrases: warn
    schema: block
    rhythm: warn                      # ровный ритм абзацев и предложений (коэффициент вариации ниже rhythm_min_cv)
    ai_tone: warn                     # шаблоны ИИ-интонации из ai_tone_patterns
    volume: warn                      # объём вне коридора направления
    norm_links: warn                  # норма (СП, СанПиН, закон) без ссылки в том же абзаце
    internal_links: warn              # ссылка на свой раздел статей ведёт не на статью корпуса
    ai_answers: warn                  # первый абзац раздела — прямой ответ; FAQ на месте
    facts: block                      # вычитка не закрыта или число совпало с просроченным фактом
    niche: block                      # требования профиля ниши
    image_alt: block                  # картинка в тексте без alt
    image_credits: block              # фото из сети без автора и лицензии
    refresh_change: block             # правка страницы: новых восьмисловных цепочек против эталона меньше refresh.min_change
  fields: {title: title, description: description, slug: slug}  # поле шапки статьи → роль (title, description, slug)
  title_length: [30, 70]              # длина title, символов
  description_length: [120, 170]     # длина description
  faq_questions: [3, 10]              # вопросов в FAQ
  sales_links: [1, 6]                 # ссылок на продающие страницы
  min_sources: 2                      # внешних источников не меньше
  max_list_share: 0.35                # доля текста в списках не больше
  link_timeout: 10                    # тайм-аут проверки ссылки, секунд
  faq_heading: "Частые вопросы"       # начало заголовка блока FAQ
  cta_markers: []                     # строки, по которым узнаётся призыв к действию обычным блоком
  hygiene_patterns: []                # свои шаблоны служебных приписок (регулярные выражения), к общим пакета
  stop_phrases: []                    # стоп-лист формулировок
  rhythm_min_cv: 0.35                 # ритм: разброс длины абзацев и предложений ниже — замечание
  ai_tone_patterns: []                # шаблоны ИИ-интонации (регулярные выражения)
  norm_patterns: ["СП \\d", "СанПиН", "ГОСТ", "ФЗ", "Федеральн\\w+ закон"]  # слова норм: такое предложение ждёт ссылку
  answer_words: 60                    # первый абзац раздела — прямой ответ не длиннее, слов

stop_words: []                        # общие слова ниши, которые дают ложные тревоги анти-дублей
brand_words: []                       # брендовые слова: такие запросы не идут в очередь

models:                               # роли модельных шагов (Т17.1): задание агенту называет основную и запасную модель;
                                      # основная недоступна — задание выполняется запасной, конвейер не встаёт. Выбор —
                                      # по навыку llm-pipeline-economy. «-latest» — последняя версия семейства на день
                                      # работы: модели меняются с обновлениями, проект к номеру версии не привязан.
                                      # codex-latest — вторая независимая модель (Codex CLI, навык second-agent)
  planner: {primary: claude-opus-latest, fallback: claude-sonnet-latest}        # бриф и план разделов
  writer: {primary: claude-opus-latest, fallback: claude-sonnet-latest}         # текст (часть 2)
  critic: {primary: claude-opus-latest, fallback: claude-sonnet-latest}         # критика тона и правил (часть 2)
  fact_checker: {primary: codex-latest, fallback: claude-sonnet-latest}         # вычитка фактов — независимой моделью
  judge: {primary: claude-opus-latest, fallback: claude-sonnet-latest}          # судья спорного (часть 2)
  cheap: {primary: deepseek/deepseek-v4-flash-0731, fallback: claude-haiku-latest}  # дешёвые оценки: модель,
                                      # прошедшая проверку на выборке, закрепляется номером (llm-pipeline-economy)

prepare:                              # разбор топа (Т18): выдача — снимок дня взятия темы, квоту не тратит
  top_n: 3                            # страниц конкурентов в разборе
  serp_max_age_days: 3                # снимок выдачи старше — `queue retake`; меньше thresholds.gate_valid_days
  volume_rule: mean                   # целевой объём: mean — среднее топа, max — наибольший; в коридоре направления
  images_margin: 0.15                 # картинок — наибольшее в топе × (1 + запас), вверх до целого
  table_rule: any                     # таблица нужна: any — хоть у одной страницы, majority — у большинства, all — у всех
  page_timeout: 20                    # тайм-аут загрузки страницы, секунд
  page_max_kb: 2048                   # предел размера страницы, КБ: больше — отказ с причиной
  page_cache_days: 30                 # кэш страниц в cache/pages/
  skip_url_patterns: ['^[^/]+/?$', '/catalog/', '/tag/', '/category/']  # не статьи (рег. выражения по «хост/путь»):
                                      # главная, каталог, метки
  main_blocks: [article, main]        # основной блок — первый найденный тег; нет — body без меню и подвала
  donors: []                          # зарубежные домены-доноры для экспертных тем: только тезисы, не текст
  donor_sitemaps: 3                   # карт сайта донора читать (с вложенными), не больше
  donor_top: 3                        # адресов донора на тему, не больше

brief:                                # бриф (Т19): пишет агент роли planner, проверяет код, утверждает человек
  authors:                            # авторы по направлениям; сверх предела в месяц — следующий по списку
    - name: Автор Примеров
      role: инженер
      experience: 10 лет в отрасли
      directions: [пример направления]
      month_limit: 8
  bridge_share: [0.05, 0.10]          # доля текста моста к продукту
  link_candidates: 10                 # кандидатов перелинковки по телам статей корпуса

assemble:                             # сборка страницы (Т20)
  adapter: html                       # html, markdown или module:<путь от инстанса>:<класс> — сборщик проекта
  template: ""                        # свой шаблон HTML (путь от инстанса); пусто — шаблон пакета
  schema_format: json-ld              # разметка: json-ld или microdata
  required_elements: []               # обязательные элементы страницы (селекторы: тег, .класс, #id)
  levels:                             # уровень автопроверок сборки: block — сборка не готова, warn — замечание, off
    anchors: block                    # внутренние якоря ведут на существующие id
    toc: block                        # якоря оглавления = разделы
    tables: block                     # в строках таблицы одинаковое число ячеек
    required: warn                    # required_elements на месте
    section_borders: warn             # у каждого раздела есть подзаголовок — нет длинных разделов без границы
    comments: block                   # публикуемый HTML без комментариев: сборка их снимает, остался — не готово

publish:                              # публикация (Т21) и «доехало» (Т22)
  mode: manual                        # manual — пакет для ручной вставки; direct — публикатор пишет на сайт сам
  allow: files                        # files — только файлы инстанса; commit — файл в репозиторий сайта; publish —
                                      # публикация. Выше files — по разрешению владельца, запись в журнале действий
  adapter: none                       # none, static_repo, cms_api или module:<путь от инстанса>:<класс>
  repo_path: ""                       # static_repo: путь к папке статей в репозитории сайта
  cms:                                # cms_api: адрес и учётка по именам переменных
    base_url: ""
    user_env: ""
    token_env: ""
  hosts: []                           # хосты, куда публикатору можно писать (белый список)
  lock_minutes: 60                    # блокировка от двойного прогона старше — снимается с записью в журнал
  text_match: 0.8                     # «доехало»: доля восьмисловных цепочек эталона, найденных на странице
  browser: false                      # вёрстка браузером (pip install content_engine[browser]); нет — «не подключено»
  widths: [1440, 1024, 390, 360]      # ширины проверки вёрстки
  counter_domains: [mc.yandex.ru, google-analytics.com, googletagmanager.com]  # счётчики: браузер их блокирует
  window: ["10:00", "18:00"]          # окно публикации `publish next`
  schedule_ahead_days: 0              # выкладка наперёд для CMS с отложенной публикацией
  journal_path: ""                    # журнал действий проекта; {yyyy-mm} — месяц дня выкладки; пусто — не подключено
  verify_retries: 2                   # «доехало»: повторов при сетевом сбое; не ответил — «не проверено», не «не доехало»
  verify_retry_seconds: 20            # пауза между повторами, секунд

indexing:                             # индексация (Т24)
  allow: files                        # files — только план; write — отправлять заявки (по разрешению владельца)
  indexnow:
    enabled: false                    # IndexNow Яндекса и Bing: файл ключа должен лежать на сайте
    key_env: INDEXNOW_KEY             # имя переменной с ключом (ключ публичный: лежит на сайте открытым файлом)
    key_location: ""                  # адрес файла ключа; пусто — https://<домен>/<ключ>.txt
  webmaster:
    enabled: false                    # переобход в Вебмастере; учётка — sources.webmaster
  status_days: [1, 3, 7, 14]          # дни от выкладки для `index status`

records:                              # записи дня выкладки в базу проекта (Т23.2)
  allow: files                        # files — только план; write — запись (по разрешению владельца)
  adapter: none                       # none или module:<путь от инстанса>:<класс>

paths:                                # папки статьи (Н1)
  allow: files                        # files — только план; write — класть статью в папку проекта (по разрешению)
  transfer: builtin                   # builtin — папка по шаблону published_dir; module:<путь>:<класс> — своя раскладка
  topic_dir: "data/briefs/{id}"       # рабочая папка темы: задания, бриф, разбор, текст, пакет
  published_dir: ""                   # папка выпущенной статьи в корпусе проекта ({slug}, {h1}, {id}); пусто — не передавать
  published_files: {article: article.md, schema: schema.json}  # имена файлов текста и разметки в этой папке

judge:                                # судья спорного (Т27)
  top: 5                              # ближайших разделов корпуса в задании судьи
  embeddings:
    kind: lexical                     # lexical — пятёрка по весам слоя 2, без установки; api — облачный провайдер
    model: ""                         # для api — провайдер: module:<путь от инстанса>:<класс> (price, embed)
    key_env: ""                       # имя переменной ключа
    price_per_1k_rub: 0               # цена за 1000 знаков, ₽ — бюджет-гейт до вызова

write:                                # задания писателю (Т28)
  rules: []                           # правила проекта: эталон статьи, тон, стоп-лист — пути от каталога инстанса
  level: обычный                      # уровень текста по умолчанию: обычный или усиленный (нужен пакет фактов)

facts:                                # библиотека фактов и вычитка (Т29)
  enabled: false                      # true — гейт статьи ждёт закрытой вычитки (review check)
  ttl_days: 365                       # срок годности подтверждённого факта, дней
  mode: separate                      # separate — вычитка отдельной моделью без контекста автора; human — человек

niche:                                # профиль ниши (Т29.4)
  kind: general                       # general, medicine, law, money или своё
  min_sources: 0                      # первоисточников в тексте не меньше
  disclaimer: ""                      # обязательная оговорка (подстрока текста); пусто — не нужна
  level: обычный                      # уровень текста не ниже

images:                               # картинки (Т30)
  allow: files                        # files — только план загрузки; write — загружать в хранилище сайта (по разрешению)
  providers:                          # провайдер по виду картинки: none, template (0 ₽), library (готовые, 0 ₽),
                                      # module:<путь от инстанса>:<класс> — платный генератор через бюджет-гейт
    cover: template
    illustration: none
    scheme: template
    product: none
  library:
    index: ""                         # CSV готовых картинок проекта: file_or_url;alt;keywords (путь от инстанса)
  fill_rule: top                      # top — картинок в теле по разбору топа; after_h2 — только места из after_h2
  upload: none                        # none — загружает провайдер или человек; module:… — отдельный загрузчик
  template: ""                        # свой HTML-шаблон обложки и схемы; пусто — шаблоны пакета
  after_h2: []                        # номера H2, после которых ставить картинку (для fill_rule: after_h2)
  max_kb: 300                         # предел размера файла, КБ (сжатие — pip install content_engine[images])
  stop_categories: []                 # категории фото из сети, которые не годятся
  cover: true                         # обложка нужна

onboard:                              # приёмка запуска (Т32.2)
  min_cluster_frequency: 100          # частотность кластера по Wordstat не ниже — ниша годна (оценка)
  sample_pages: 5                     # живых страниц на проверку вёрстки
  answers: {}                         # решения человека: vychitka (separate/human), rhythm (статей в день)

monitor:                              # пульс (Т34): позиции, дрифт, вердикт дня
  positions: consoles                 # consoles — Search Console и Вебмастер (бесплатно, факт); none; module:…
  keys: demand_map                    # чьи ключи: целевые ключи страниц из карты спроса и записей выпуска
  drop: 5                             # тревога: позиция упала на столько и больше
  tops: [10, 30]                      # тревога: вход в топ и выход из топа
  silence_intervals: 2                # красный: публикаций нет дольше стольких интервалов ритма (1 / queue.per_day дней)
  stock_yellow_days: 3                # жёлтый: запас тем меньше чем на столько дней
  audit_stale_days: 30                # жёлтый: аудит старше или аудита нет
  drift_shrink: 0.33                  # дрифт «важно»: текст короче эталона больше чем на эту долю
  index_days_alarm: 14                # замечание: новый адрес не в индексе к этому дню от выкладки

notify:                               # сводка пульса в мессенджер (Т34.5) — запись вовне
  allow: files                        # files — только план; write — отправка (по разрешению владельца, строка журнала)
  kind: none                          # none; lark_webhook; telegram; module:<путь от инстанса>:<класс>
  url_env: ""                         # имя переменной: адрес вебхука Lark или токен бота Telegram
  chat_env: ""                        # Telegram: имя переменной с id чата; Lark — пусто

bets:                                 # книга ставок и замер (Т39)
  money:
    kind: none                        # none — «не подключено»; file — CSV slug;money;leads;period_from;period_to;source;as_of; module:…
    file: ""                          # путь от инстанса для kind: file
  min_step: 2                         # ступени лесенки 1–2 — данные; 3–4 (proxy, нет данных) — итог «мало данных»
  proposal_dir: data/proposals        # куда класть файлы-предложения для Движка роста
  backfill_section: ""                # раздел сайта статей для книги задним числом; пусто — весь корпус

economics:                            # экономика статьи и закрытие направления (Т40)
  close_min_articles: 3               # предложить закрыть направление, если статей с наступившим окном не меньше
  close_window: 90                    # окно замера, дней
  close_leads_max: 0                  # и заявок за окно не больше (ступени 1–2)

audit:                                # аудит недели (Т35)
  checklist: tech_checklist.yaml      # технический чек-лист проекта, путь от инстанса (`audit checklist` кладёт шаблон)
  false_alarm:                        # последний замер доли ложных тревог гейта темы; rate -1 — не замерено
    rate: -1
    as_of: ""
    source: ""
  false_alarm_max: 0.20               # задачи на склейку — только если доля ниже
  neighbours: 5                       # ближайших соседей изменившейся страницы для сверки пересечений
  inspect_limit: 50                   # проверок адреса Search Console за прогон, не больше
  speed: none                         # скорость на мобильном: none — «не подключено»; module:…
  delay_seconds: 1                    # пауза между загрузками страниц своего сайта

schedule:                             # расписание (Т42.1) — запись за пределы инстанса
  allow: files                        # files — только план; write — установка (по разрешению владельца)
  kind: windows                       # windows (планировщик), cron, module:…
  python: "py -3"                     # чем запускать Python
  on_boot: true                       # пропущенный запуск — один раз при включении
  month_day: 1                        # день месяца для заданий every: month (1–28)
  # ai citations (раз в месяц) — после того как проект разрешил квоту: ai_visibility.max_quota > 0
  jobs:                               # {name, command, every: day|week|month, at: "ЧЧ:ММ", weekday: mon…sun или ""}; у команды — --unattended
    - {name: pulse, command: pulse run, every: day, at: "09:00", weekday: ""}
    - {name: measure, command: bet measure, every: day, at: "09:10", weekday: ""}
    - {name: audit, command: audit run, every: week, at: "09:20", weekday: mon}
    - {name: week, command: week plan, every: week, at: "10:00", weekday: mon}
    - {name: refresh, command: refresh scan, every: week, at: "10:10", weekday: mon}
    - {name: ai-score, command: ai score, every: week, at: "10:20", weekday: mon}
    - {name: competitors, command: competitors snap, every: week, at: "10:30", weekday: mon}
    - {name: freeze, command: freeze scan, every: month, at: "10:40", weekday: ""}
    - {name: field, command: field probe, every: month, at: "10:50", weekday: ""}

week_plan:                            # план работ на неделю (Т42.3)
  min: 5
  max: 8

refresh:                              # дожим и актуализация (Т36): правка страницы той же очередью и тем же гейтом
  zone: [4, 15]                       # позиции зоны дожима
  min_impressions: 50                 # показов запроса за окно консоли, не меньше
  positions_max_age: 8                # снимок позиций старше стольких дней — «нет данных», а не пустой список
  age_days: 120                       # статья старше — кандидат на актуализацию
  min_change: 0.2                     # доля новых восьмисловных цепочек против эталона; ниже — пустое обновление
  weekly_limit: 3                     # взятий правки в очередь за 7 дней, не больше
  allow_behavior: false               # кандидаты из утверждённых находок поведения (behavior accept)

ai_visibility:                        # ИИ-видимость (Т37)
  answer_words: [40, 60]              # прямой ответ в начале раздела, слов
  section_max_words: 400              # раздел H2 — цитируемый кусок не длиннее
  bots: [GPTBot, OAI-SearchBot, ChatGPT-User, ClaudeBot, Claude-SearchBot, PerplexityBot, Google-Extended, YandexAdditional]  # ИИ-краулеры: закрыт в robots — находка
  min_score: 4                        # балл 0–6 ниже — кандидат дожима
  citations: none                     # none; keysso — отчёт ответов Алисы (квота); keysso_tracker — чтение трекера, созданного человеком
  tracker_id: ""                      # id трекера нейросетей Keys.so (только для keysso_tracker)
  max_quota: 0                        # предел квоты Keys.so на прогон цитирования; 0 — запросов нет (разрешение проекта тратить квоту)
  max_pages: 20                       # страниц отчёта за прогон, не больше

behavior:                             # поведение на странице (Т38) — опция
  kind: none                          # none — «не подключено»; metrika — отчёты API Метрики; module:…
  counter_env: ""                     # имя переменной с номером счётчика
  token_env: ""                       # имя переменной с токеном (только чтение отчётов)
  window_days: 28                     # окно отчёта и базовой линии, дней
  min_people: 100                     # решение — только на шаге, через который прошло не меньше
  drop_share: 0.7                     # обрыв: доля ушедших с шага больше
  device_ratio: 1.5                   # аномалия устройства: отказ во столько раз выше остальных
  min_gain: 0.1                       # правка сработала: показатель лучше базовой линии на эту долю
  funnel: []                          # шаги воронки: адреса или «goal:<id>»
  recheck_days: [14, 28]              # замер правки на эти дни после публикации

freeze:                               # заморозка по динамике спроса (Т41.1)
  months: 24                          # ряд, месяцев: два года по 12
  drop_share: 0.5                     # последние 12 месяцев ниже предыдущих 12 на эту долю
  min_months_down: 8                  # и столько из 12 месяцев ниже того же месяца год назад (не сезон)
  min_frequency: 10                   # средняя частота за последние 12 месяцев ниже — «мало спроса», не кандидат
  refetch_days: 30                    # ряд старше — дозапрос (облако Wordstat, бюджет-гейт)
  top: 200                            # кластеров по весу в разбор, не больше: дозапрос ряда — рубли за каждый головной запрос

competitors:                          # разведка конкурентов (Т41.2): устройство их статей и темп, не слежка за позициями
  window_days: 14                     # окно новых адресов
  max_pages: 30                       # страниц разбора за прогон, не больше
  delay_seconds: 1                    # пауза между загрузками

field:                                # «поле шире освоенного» (Т41.3)
  file: ""                            # файл формулировок «направление;формулировка» от инстанса; пусто — «не подключено»
  max: 25                             # формулировок за прогон, не больше
