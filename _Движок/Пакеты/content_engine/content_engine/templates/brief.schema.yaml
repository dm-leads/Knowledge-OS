# Схема брифа статьи (Т19): файл data/briefs/<id>/brief.yaml. Заполняет агент роли planner по заданию task_brief.md,
# проверяет `content-engine prepare check <id>`, утверждает человек `prepare approve <id> --who <имя>`.
h1: "Заголовок H1 статьи"
title: "Title страницы — длина по gate_article.title_length"
description: "Description — длина по gate_article.description_length"
slug: latinica-cherez-defis            # латиница нижнего регистра, цифры, одиночные дефисы
angle: "Угол статьи: чего нет у лидеров выдачи (пробелы разбора топа)"
level: обычный                         # обычный | усиленный (сначала пакет проверенных фактов — часть 2)
sections:                              # разделы: H2 и подзаголовки H3; у каждого раздела есть явная граница
  - h2: "Раздел"
    h3: ["Подраздел"]
faq:                                   # вопросы из живого спроса: число — gate_article.faq_questions
  - q: "Как …?"                        # начинается с вопросительного слова, кончается «?»
    from_query: "запрос кластера"      # запрос кластера, основы которого есть в вопросе
author: "Имя из brief.authors"         # по направлению темы, с учётом предела статей в месяц
links: []                              # ссылки внутри текста — только из кандидатов перелинковки задания
read_also: []                          # «Читайте также» — только из кандидатов перелинковки
bridge:
  place: "после раздела …"             # где мост к продукту
  share: 0.07                          # доля текста моста: brief.bridge_share
  honesty_limit: "Чего продукт не делает — граница честности"   # обязательна для утверждения
cta_place: "после раздела … обычным блоком"   # призыв к действию — обычный блок, не заголовок
tokens: null                           # необязательно: токены работы агента (иначе расход — «нет данных»)
model_used: ""                         # необязательно: какая модель и версия выполнили задание на деле
