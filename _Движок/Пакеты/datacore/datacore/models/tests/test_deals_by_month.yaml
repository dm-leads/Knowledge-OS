test_deals_by_month:
  model: metrics.deals_by_month
  inputs:
    facts.deal:
      columns:
        deal_id: BIGINT
        brand: VARCHAR
        created_at: TIMESTAMPTZ
        deleted_at: TIMESTAMPTZ
      rows:
        - {deal_id: 1, brand: b1, created_at: "2026-08-03 10:00:00+03", deleted_at: null}
        - {deal_id: 2, brand: b1, created_at: "2026-08-20 10:00:00+03", deleted_at: null}
        - {deal_id: 3, brand: b2, created_at: "2026-08-21 10:00:00+03", deleted_at: null}
        - {deal_id: 4, brand: b1, created_at: "2026-08-22 10:00:00+03", deleted_at: "2026-08-23 10:00:00+03"}
  outputs:
    query:
      rows:
        - {brand: b1, month: 2026-08-01, deals: 2}
        - {brand: b2, month: 2026-08-01, deals: 1}
